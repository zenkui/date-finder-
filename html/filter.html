<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Finder Filter</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/filter.css">
</head>
<body>

    <div class="top-bar">
        <div class="heart-box">❤️</div>
        <button class="finder-btn">FINDER</button>
    </div>

    <div class="sub-buttons">
        <button class="active">home</button>
        <button>chats</button>
    </div>

    <div class="filter-card">
        <h2>Filter Your Matches</h2>

        <!-- Age Filter -->
        <div class="filter-card">
            <label for="age">Age</label>
            <select id="age" name="age">
                <option value="any">Any</option>
                <option value="18-28">18 - 28</option>
                <option value="28-38">28 - 38</option>
                <option value="38-48">38 - 48</option>
                <option value="48-58">48 - 58</option>
                <option value="58-68">58 - 68</option>
                <option value="68-78">68 - 78</option>
                <option value="78-88">78 - 88</option>
                <option value="88-100">88 - 100</option>
            </select>
        </div>

        <!-- Gender Filter -->
        <div class="filter-card">
            <label for="gender">Gender</label>
            <select id="gender" name="gender">
                <option value="any">Any</option>
                <option value="female">Female</option>
                <option value="male">Male</option>
                <option value="nonbinary">Non-binary</option>
            </select>
        </div>

        <!-- Religion Filter -->
        <div class="filter-card">
            <label for="religion">Religion</label>
            <select id="religion" name="religion">
                <option value="any">Any</option>
                <option value="christianity">Christianity</option>
                <option value="islam">Islam</option>
                <option value="hinduism">Hinduism</option>
                <option value="buddhism">Buddhism</option>
                <option value="other">Other</option>
            </select>
        </div>

        <!-- Distance Filter -->
        <div class="filter-card">
            <label for="distance">Max Distance (km)</label>
            <input type="number" id="distance" name="distance" placeholder="Enter max distance" min="1" max="500">
        </div>

        <button class="apply-btn">Apply Filters</button>
    </div>
<script>
    // Select the buttons individually
    const homeButton = document.querySelector('.sub-buttons button:first-child');
    const chatsButton = document.querySelector('.sub-buttons button:last-child');

    // Navigate when clicked
    homeButton.addEventListener('click', () => {
        window.location.href = 'index.html'; // path to your home page
    });

    chatsButton.addEventListener('click', () => {
        window.location.href = 'chat.html'; // path to your chats page
    });
</script>
</body>
</html>
