<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Finder UI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="top-bar">
        <div class="heart-box">❤️</div>
        <button class="finder-btn">FINDER</button>
    </div>

    <div class="sub-buttons">
        <button>filter</button>
        <button>chats</button>
    </div>

    <div class="cards-wrapper">
        <div class="arrow">←</div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e" alt="Sarah">
            <h3>Sarah Jenkins</h3>
            <p>24 years</p>
            <p>New York, NY</p>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e" alt="Michael">
            <h3>Michael Chen</h3>
            <p>28 years</p>
            <p>San Francisco, CA</p>
        </div>

        <div class="arrow">→</div>
    </div>

</body>
</html>
